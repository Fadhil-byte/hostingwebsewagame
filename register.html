<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Daftar akun SewaGame gratis untuk mulai menyewa game online dan Android.">
    <meta name="theme-color" content="#0f172a">
    <title>Daftar Akun Baru - SewaGame</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3 & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Modern Fixed Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <span class="brand-icon-box">
                    <i class="bi bi-controller"></i>
                </span>
                <span>Sewa<span>Game</span></span>
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                    <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Katalog Game</a></li>
                </ul>
                <ul class="navbar-nav ms-auto align-items-lg-center gap-2 pt-2 pt-lg-0">
                    <li class="nav-item">
                        <a href="login.html" class="btn btn-outline-light btn-sm w-100">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Masuk
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="register.html" class="btn btn-primary btn-sm w-100 active">
                            <i class="bi bi-person-plus me-1"></i> Daftar Akun
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Content Spacing -->
    <div style="height: 76px;"></div>

    <!-- Main Content -->
    <main class="flex-grow-1">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                    <div class="auth-card">
                        <div class="text-center mb-4">
                            <span class="brand-icon-box mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
                                <i class="bi bi-person-plus"></i>
                            </span>
                            <h3 class="fw-bold mb-1">Buat Akun Baru</h3>
                            <p class="text-muted small mb-0">Daftar sekarang untuk mulai menyewa berbagai game PC & Android.</p>
                        </div>

                        <form action="home.html" method="GET">
                            <div class="mb-3">
                                <label for="name" class="form-label">Nama Lengkap</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted border-end-0">
                                        <i class="bi bi-person"></i>
                                    </span>
                                    <input type="text" class="form-control border-start-0 ps-0" id="name" name="name" placeholder="Nama Anda" required value="User Demo">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Alamat Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted border-end-0">
                                        <i class="bi bi-envelope"></i>
                                    </span>
                                    <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" placeholder="nama@email.com" required value="pembeli@sewagame.com">
                                </div>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-12 col-sm-6">
                                    <label for="password" class="form-label">Kata Sandi</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted border-end-0">
                                            <i class="bi bi-lock"></i>
                                        </span>
                                        <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Min. 8 karakter" required value="password">
                                    </div>
                                </div>

                                <div class="col-12 col-sm-6">
                                    <label for="password_confirmation" class="form-label">Ulangi Sandi</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted border-end-0">
                                            <i class="bi bi-lock-fill"></i>
                                        </span>
                                        <input type="password" class="form-control border-start-0 ps-0" id="password_confirmation" name="password_confirmation" placeholder="Ulangi sandi" required value="password">
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fs-6 mb-3">
                                <i class="bi bi-person-check-fill me-1"></i> Selesaikan Pendaftaran
                            </button>
                        </form>

                        <div class="text-center pt-3 border-top">
                            <p class="text-muted small mb-0">
                                Sudah memiliki akun?
                                <a href="login.html" class="fw-bold text-primary">Masuk di sini</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modern Footer -->
    <footer class="footer-custom pt-4 pb-3 mt-auto">
        <div class="container text-center small text-secondary">
            <div>&copy; 2026 SewaGame. Seluruh hak cipta dilindungi undang-undang.</div>
        </div>
    </footer>

    <!-- Bootstrap JS & App JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
